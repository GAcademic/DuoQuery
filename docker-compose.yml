name: duoquery

services:
  db:
    image: postgres:16
    container_name: duoquery-db
    environment:
      POSTGRES_USER: duoquery
      POSTGRES_PASSWORD: duoquery
      POSTGRES_DB: pagila
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duoquery -d pagila"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: duoquery-app
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pagila
      DB_USER: duoquery
      DB_PASSWORD: duoquery
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
